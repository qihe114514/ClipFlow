name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 不再使用 android-actions/setup-android@v3：新镜像的 sdkmanager 已移除 "tools" 包，
      # 该 action 会因 "Failed to find package 'tools'" 失败。这里直接安装构建所需组件。
      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          TOOLS_BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -z "$TOOLS_BIN" ]; then TOOLS_BIN="$(dirname "$(command -v sdkmanager)")"; fi
          export PATH="$TOOLS_BIN:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore release signing keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.CLIPFLOW_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          files: app/build/outputs/apk/release/app-release.apk
